<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1020" />
    <title>Hors connexion</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { margin: 0 auto 24px; max-width: 320px; color: #475569; line-height: 1.5; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 22px;
        background: #1d35d8;
        color: #fff;
        font: 600 15px system-ui, sans-serif;
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        margin: 0 auto;
        background: linear-gradient(135deg, #2548eb, #1e2d8a);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Vous êtes hors connexion</h1>
      <p>Vérifiez votre connexion Internet, puis réessayez. Vos données sont en sécurité sur le serveur.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
